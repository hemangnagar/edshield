# COPPA profile for services used by children under 13.
# COPPA (16 CFR 312.2) treats persistent identifiers (usernames, screen
# names, device IDs), contact information and geolocation as personal
# information. This profile is recall-first: lower confidence thresholds,
# usernames and IDs always removed, and no surrogate generation for
# contact fields (a fake email is still an email a child might use).
name: coppa
description: Recall-first removal of children's personal information from chat, transcripts and submissions before any model call.
default_method: mask
min_confidence: 0.35
# Recall-first decoding: the model flags a token whenever P(O) < 0.99, and the
# confidence floors above then apply to rule spans only. Measured on five
# trained copies: default decoding left 0-3 of 165 held-out identifiers
# depending on the copy; this leaves 0 on every copy.
o_threshold: 0.99
allow_method_override: true
labels:
  NAME_STUDENT: {enabled: true, mask: "[CHILD]", min_confidence: 0.3}
  EMAIL: {enabled: true, method: mask}
  USERNAME: {enabled: true, method: mask, min_confidence: 0.3}
  ID_NUM: {enabled: true, min_confidence: 0.5}
  PHONE_NUM: {enabled: true, method: mask}
  URL_PERSONAL: {enabled: true, method: mask}
  STREET_ADDRESS: {enabled: true, method: mask}
  SSN: {enabled: true, method: mask}
  DATE: {enabled: true, method: shift_dates}
  # Persistent identifiers and geolocation (16 CFR 312.2), and the people and places around the child.
  NAME_RELATED: {enabled: true, mask: "[PERSON]", min_confidence: 0.3}
  SCHOOL: {enabled: true, method: mask}
  LOCATION: {enabled: true, method: mask}
  AGE: {enabled: true, method: mask}
  IP_ADDRESS: {enabled: true, method: mask}
  DEVICE_ID: {enabled: true, method: mask}
  GEO: {enabled: true, method: mask}
